[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-hadamard-experiments"
version = "0.1.0"
description = "Resumable experiments for prefix-based sparse Walsh-Hadamard recovery"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2", "numba>=0.61,<1", "threadpoolctl>=3.5,<4", "galois>=0.4.6,<0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["upstream_manifest.json"]
